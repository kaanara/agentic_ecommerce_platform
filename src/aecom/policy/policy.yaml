# Escalation matrix — the in-line execution gate.
#
# Every tool call goes through aecom.policy.gate before it runs.
#   T0  read-only                → allow
#   T1  low-risk, reversible     → allow + audit
#   T2  bounded risk             → allow inside limits, otherwise escalate to a human
#   T3  high stakes / public     → always escalate to a human
#   T4  forbidden for agents     → deny
#
# Rule keys:
#   tier:        T0..T4
#   agents:      optional list; anyone else is denied
#   limits:      {arg_name: max_value}; exceeding any → escalate
#   price_change_pct_max: escalate if a price moves more than this % vs. current
#   monthly_budget_setting: escalate if this spend pushes the month past ops_settings[<key>]
#   recipient_must_be_counterparty: escalate unless args["to"] is the customer the current run serves
#   reason:      shown to the human in the approvals dashboard
#   stages:      Phase 5 autonomy stages (T2 rules with limits only). Stage 1 = the rule as written; stages 2 and 3 are
#                earned per action (ops_settings "autonomy_stage:<tool>", raised only by a human with recorded evidence,
#                lowered automatically or by a human, always back to 1). A stage may override ONLY "limits" (merged over
#                the base limits), "price_change_pct_max" and (stage 3) "notify: true". HARD CAPS NEVER MOVE: a stage
#                never touches monthly_budget_setting, recipient_must_be_counterparty, tier, agents or any T3/T4 rule.
#
# F5: MCP tools (aecom.policy.gate.resolve_rule). A rule key can be ``mcp:<server>/<tool>`` (exact) or
# ``mcp:<server>/*`` (every tool on that server not given its own exact rule); both take the same fields as any other
# rule above. Resolution order: exact tool rule > server wildcard > `defaults.mcp_unclassified_tier`. A wildcard rule
# with tier T0 or T1 on a server whose name looks financial (stripe, paypal, pay, bank, billing, invoice, checkout,
# finance, wallet, ledger) is rejected by `aecom.policy.versions.validate_yaml` unless it carries
# ``acknowledge_financial_wildcard: true`` (a plain field, not a comment - comments are stripped by the YAML parser
# and can't be validated).

defaults:
  unknown_tool_tier: T3          # non-MCP tools nobody classified yet (should not normally happen) are high-stakes
  mcp_unclassified_tier: T3      # MCP tools nobody classified (no exact or server-wildcard rule) need a human (F5)
  sandboxed_tool_tier: T3        # anything from a sandboxed MCP server needs a human
  # Side-effecting tools that keep running while ops_settings.agents_paused is on (the kill switch still stops them).
  continue_while_paused:
    - deliver_order
    - add_license_keys           # restocking keys so deliveries can continue
  # Side-effecting tools that keep running in safe mode (ops_settings.safe_mode, switched on by the monitors when a
  # P1 stays unacknowledged for 2 h; only a human switches it off). Everything else - all spending - is denied.
  # The kill switch still stops these; send_email keeps its recipient_must_be_counterparty rule.
  continue_in_safe_mode:
    - deliver_order
    - add_license_keys
    - reply_email
    - send_email
  # Pending approvals expire after this many hours; an expired one can't be approved (the agent must re-request).
  approval_ttl_hours: 72
  # Agents never sign up, log in or submit forms. fnmatch, case-insensitive, matched against the full
  # tool name and the bare tool part of "mcp:<server>/<tool>". A match is always a T4 deny, read-only or not.
  forbidden_patterns:
    - "*sign_up*"
    - "*signup*"
    - "*create_account*"
    - "*register_account*"
    - "*login*"
    - "*log_in*"
    - "*sign_in*"
    - "*signin*"
    - "*submit_form*"
    - "*fill_form*"
    - "*form_submit*"
    - "*browser_type*"
    - "*browser_click*"
    - "*file_upload*"
    - "*enter_password*"
    - "*payment_method*"

budgets:                         # € of LLM spend per agent per day (checked before each agent run)
  ceo: 10
  researcher: 6
  judge: 4
  foreman: 6
  finance: 4
  store_ops: 2
  marketing: 2
  support: 3
  supply: 2
  sentinel: 3
  engineer: 4

company_settings_defaults:
  marketing_budget_month_eur: 1500
  vendor_budget_month_eur: 400
  engineer_pr_daily_cap: 3        # E3: max PRs the Engineer may open per day (ops_settings overrides this)

rules:
  # ---------------------------------------------------------------- read-only
  list_products: {tier: T0}
  get_inventory: {tier: T0}
  list_orders: {tier: T0}
  get_order: {tier: T0}
  get_pnl: {tier: T0}
  get_kpis: {tier: T0}
  list_okrs: {tier: T0}
  list_decisions: {tier: T0}
  list_vendors: {tier: T0}
  list_campaigns: {tier: T0}
  list_registry: {tier: T0}
  recall_memory: {tier: T0}
  read_company_doc: {tier: T0}
  fetch_url: {tier: T0}
  list_inbox: {tier: T0}
  list_pending_approvals: {tier: T0}
  # K4: Sentinel diagnostics (aecom.tools.diagnostics), read-only
  list_open_incidents: {tier: T0}
  get_incident: {tier: T0}
  recent_errors: {tier: T0}
  run_timeline: {tier: T0}
  event_bus_status: {tier: T0}
  dead_letters: {tier: T0}
  doctor_report: {tier: T0}

  # ---------------------------------------------------------------- terminal / structured-output tools
  submit_plan: {tier: T0, agents: [foreman]}
  submit_verdict: {tier: T0, agents: [judge]}
  submit_brief: {tier: T0}
  submit_diagnosis: {tier: T1, agents: [sentinel]}   # K4: appends a diagnosis note to an incident
  submit_report: {tier: T1, agents: [finance, ceo]}   # J3: stored, immutable report snapshot

  # ---------------------------------------------------------------- K5/K9: Sentinel remediation (aecom.tools.remediation)
  # Only the runbooks' safe actions. Unpausing, leaving safe mode, the kill switch and incident status stay human.
  replay_dead_letter:
    tier: T2
    agents: [sentinel]
    topic_prefixes: [order., inventory., email.]   # any other topic escalates (checked by the tool itself)
    reason: "Replaying an event outside order/inventory/email may repeat side effects a human should judge."
  rerun_reconciler: {tier: T1, agents: [sentinel]}
  resend_delivery_email:
    tier: T2
    agents: [sentinel]          # the tool refuses orders that are not delivered or already got their email
    reason: "Resending a customer's access email."
  pause_agents: {tier: T1, agents: [sentinel]}   # protective only; unpausing is human
  propose_correcting_entry:
    tier: T3
    agents: [sentinel]
    reason: "Correcting entry for the ledger: a human approves; it is appended (memo 'correction:'), never an edit."

  # ---------------------------------------------------------------- E3: Engineer (aecom.engineer.tools)
  # Containment is mostly in code, not the gate: aecom.engineer.workspace confines every path to the Engineer's
  # own clone (never the live checkout) and enforces its write allow/deny list; aecom.engineer.github_api caps the
  # diff size, scans for secrets and requires eng_run_tests to have passed on the exact commit being shipped. The
  # gate only adds the usual escalation matrix on top: reads are T0, writes T2 (no numeric "limits" apply to a
  # path/content pair - the allow/deny list in code is the real bound), tests T1, and opening a PR is T3, so it
  # always goes to a human; eng_open_pr's own checks run only once that approval executes (same pattern as
  # propose_correcting_entry above).
  eng_read_file: {tier: T0, agents: [engineer]}
  eng_list_files: {tier: T0, agents: [engineer]}
  eng_search: {tier: T0, agents: [engineer]}
  eng_diff: {tier: T0, agents: [engineer]}
  eng_write_file: {tier: T2, agents: [engineer]}
  eng_run_tests: {tier: T1, agents: [engineer]}
  eng_open_pr:
    tier: T3
    agents: [engineer]
    reason: "Opening a PR pushes a branch and calls the GitHub API; a human reviews the diff before it can run."

  # ---------------------------------------------------------------- store
  create_product: {tier: T1, agents: [store_ops]}
  add_license_keys: {tier: T1, agents: [store_ops, supply]}
  activate_product: {tier: T1, agents: [store_ops]}
  deliver_order: {tier: T1, agents: [store_ops]}
  update_price:
    tier: T2
    agents: [store_ops, finance]
    price_change_pct_max: 20
    stages:
      2: {price_change_pct_max: 30}
      3: {price_change_pct_max: 50, notify: true}
    reason: "Price changes above 20% affect margin and customer trust."
  refund_order:
    tier: T2
    agents: [support, finance]
    limits: {amount_eur: 50}
    stages:
      2: {limits: {amount_eur: 150}}
      3: {limits: {amount_eur: 500}, notify: true}
    reason: "Refunds above €50 need a human."

  # ---------------------------------------------------------------- communication
  send_email:
    tier: T2
    agents: [support, store_ops, marketing]
    recipient_must_be_counterparty: true
    reason: "Emails to anyone other than the customer of the current case could leak customer data."
  reply_email:
    tier: T1
    agents: [support]           # the tool itself refuses messages that aren't from the current customer
  send_newsletter:
    tier: T3
    agents: [marketing]
    reason: "Bulk email to customers is public-facing and has GDPR implications."
  message_owner:
    tier: T1
    agents: [ceo, finance, researcher, sentinel, foreman]   # the chat-eligible agents (§1)
  consult_agent:
    tier: T1
    # the chat-eligible agents (§1); built only inside a chat run (aecom.graph.agents), never listed in a
    # persona's TOOLS.md, so automated runs never see it regardless of this rule.
    agents: [ceo, finance, researcher, sentinel, foreman]
  publish_social_post:
    tier: T3
    agents: [marketing]
    reason: "Public content under the brand."

  # ---------------------------------------------------------------- marketing
  create_campaign: {tier: T1, agents: [marketing]}
  pause_campaign: {tier: T1, agents: [marketing, finance, ceo]}
  launch_campaign:
    tier: T2
    agents: [marketing]
    limits: {budget_eur: 150}
    stages:
      2: {limits: {budget_eur: 300}}
      3: {limits: {budget_eur: 600}, notify: true}
    monthly_budget_setting: marketing_budget_month_eur
    reason: "Ad spend above €150 per campaign or beyond the monthly marketing budget."

  # ---------------------------------------------------------------- finance & supply
  record_expense:
    tier: T2
    agents: [finance]
    limits: {amount_eur: 200}
    stages:
      2: {limits: {amount_eur: 400}}
      3: {limits: {amount_eur: 800}, notify: true}
  register_vendor:
    tier: T2
    agents: [supply, foreman]
    limits: {monthly_cost_eur: 50}
    stages:
      2: {limits: {monthly_cost_eur: 100}}
      3: {limits: {monthly_cost_eur: 200}, notify: true}
    monthly_budget_setting: vendor_budget_month_eur
    reason: "New recurring vendor cost."

  # ---------------------------------------------------------------- executive
  set_okr: {tier: T1, agents: [ceo]}
  record_decision: {tier: T1, agents: [ceo]}
  request_provisioning:
    tier: T3
    agents: [ceo]
    reason: "Creating accounts, accepting terms, and adding payment methods happen only by a human."
  request_account_need: {tier: T1}   # E4: any agent may say it needs an account; the CEO decides, a human provisions

  # ---------------------------------------------------------------- memory
  remember: {tier: T1}
  propose_lesson: {tier: T1}

  # ---------------------------------------------------------------- self-tooling
  propose_tool: {tier: T1, agents: [foreman, researcher]}
  sandbox_tool: {tier: T1, agents: [foreman]}
  approve_tool:
    tier: T3
    agents: [foreman]
    reason: "Promotes a new MCP server or skill to production."
  grant_tool:
    tier: T3
    agents: [foreman]
    reason: "Changes which agent can use which capability."

  # ---------------------------------------------------------------- MCP tools (F5)
  # "mcp:<server>/<tool>" exact, or "mcp:<server>/*" for every other tool on that server. Only the servers the repo
  # actually seeds get a live rule here (grep registry seeds: aecom.bootstrap seeds "aecom-store" in
  # init(with_registry_examples=True)); anything else stays unclassified (defaults.mcp_unclassified_tier) until a
  # human classifies it via propose_tool/approve_tool/grant_tool. See docs/wiki/Policy-and-Approvals.md for a
  # commented-out stripe example (not live - no such server is registered).
  mcp:aecom-store/refund_order:
    tier: T2
    agents: [support, finance]
    limits: {amount_eur: 50}
    reason: "Same limit as the built-in refund_order (F5); the MCP-qualified name needs its own rule."
  mcp:aecom-store/deliver_order: {tier: T1, agents: [store_ops]}
  mcp:aecom-store/*:
    tier: T3
    reason: "Any other aecom-store tool (create/activate/update_price, ...) needs a human until classified."

  # M2: optional read-only browser (Playwright MCP, off until a human approves it). Budgets are enforced by
  # aecom.browser_guard; everything that could act on a page or leave the sandbox is denied.
  mcp:playwright/browser_navigate:
    tier: T1
    agents: [researcher]
    limits: {max_calls_per_run: 20, max_navigations_per_run: 5, max_calls_per_domain_per_run: 10}
    reason: "Read-only navigation; URL checks and budgets are enforced by aecom.browser_guard."
  mcp:playwright/browser_snapshot: {tier: T1, agents: [researcher], limits: {max_calls_per_run: 20}}
  mcp:playwright/browser_take_screenshot: {tier: T1, agents: [researcher], limits: {max_calls_per_run: 20}}
  mcp:playwright/browser_click: {tier: T4}
  mcp:playwright/browser_type: {tier: T4}
  mcp:playwright/browser_fill_form: {tier: T4}
  mcp:playwright/browser_press_key: {tier: T4}
  mcp:playwright/browser_select_option: {tier: T4}
  mcp:playwright/browser_file_upload: {tier: T4}
  mcp:playwright/browser_evaluate: {tier: T4}
  mcp:playwright/browser_run_code: {tier: T4}
  mcp:playwright/browser_install: {tier: T4}
  mcp:playwright/browser_drag: {tier: T4}
  mcp:playwright/browser_hover: {tier: T4}
  mcp:playwright/browser_handle_dialog: {tier: T4}
  mcp:playwright/browser_tabs: {tier: T4}
  mcp:playwright/*: {tier: T4}

  # ---------------------------------------------------------------- never by an agent
  delete_customer_data: {tier: T4}
  change_policy: {tier: T4}
