# Escalation matrix — the in-line execution gate.
#
# Every tool call goes through aecom.policy.gate before it runs.
#   T0  read-only                → allow
#   T1  low-risk, reversible     → allow + audit
#   T2  bounded risk             → allow inside limits, otherwise escalate to a human
#   T3  high stakes / public     → always escalate to a human
#   T4  forbidden for agents     → deny
#
# Rule keys:
#   tier:        T0..T4
#   agents:      optional list; anyone else is denied
#   limits:      {arg_name: max_value}; exceeding any → escalate
#   price_change_pct_max: escalate if a price moves more than this % vs. current
#   monthly_budget_setting: escalate if this spend pushes the month past ops_settings[<key>]
#   recipient_must_be_counterparty: escalate unless args["to"] is the customer the current run serves
#   reason:      shown to the human in the approvals dashboard

defaults:
  unknown_tool_tier: T3          # MCP tools nobody classified yet are treated as high-stakes
  sandboxed_tool_tier: T3        # anything from a sandboxed MCP server needs a human
  # Side-effecting tools that keep running while ops_settings.agents_paused is on (the kill switch still stops them).
  continue_while_paused:
    - deliver_order
    - add_license_keys           # restocking keys so deliveries can continue
  # Side-effecting tools that keep running in safe mode (ops_settings.safe_mode, switched on by the monitors when a
  # P1 stays unacknowledged for 2 h; only a human switches it off). Everything else - all spending - is denied.
  # The kill switch still stops these; send_email keeps its recipient_must_be_counterparty rule.
  continue_in_safe_mode:
    - deliver_order
    - add_license_keys
    - reply_email
    - send_email
  # Pending approvals expire after this many hours; an expired one can't be approved (the agent must re-request).
  approval_ttl_hours: 72
  # Agents never sign up, log in or submit forms. fnmatch, case-insensitive, matched against the full
  # tool name and the bare tool part of "mcp:<server>/<tool>". A match is always a T4 deny, read-only or not.
  forbidden_patterns:
    - "*sign_up*"
    - "*signup*"
    - "*create_account*"
    - "*register_account*"
    - "*login*"
    - "*log_in*"
    - "*sign_in*"
    - "*signin*"
    - "*submit_form*"
    - "*fill_form*"
    - "*form_submit*"
    - "*browser_type*"
    - "*browser_click*"
    - "*file_upload*"
    - "*enter_password*"
    - "*payment_method*"

budgets:                         # € of LLM spend per agent per day (checked before each agent run)
  ceo: 10
  researcher: 6
  judge: 4
  foreman: 6
  finance: 4
  store_ops: 2
  marketing: 2
  support: 3
  supply: 2
  sentinel: 3

company_settings_defaults:
  marketing_budget_month_eur: 1500
  vendor_budget_month_eur: 400

rules:
  # ---------------------------------------------------------------- read-only
  list_products: {tier: T0}
  get_inventory: {tier: T0}
  list_orders: {tier: T0}
  get_order: {tier: T0}
  get_pnl: {tier: T0}
  get_kpis: {tier: T0}
  list_okrs: {tier: T0}
  list_decisions: {tier: T0}
  list_vendors: {tier: T0}
  list_campaigns: {tier: T0}
  list_registry: {tier: T0}
  recall_memory: {tier: T0}
  read_company_doc: {tier: T0}
  fetch_url: {tier: T0}
  list_inbox: {tier: T0}
  list_pending_approvals: {tier: T0}
  # K4: Sentinel diagnostics (aecom.tools.diagnostics), read-only
  list_open_incidents: {tier: T0}
  get_incident: {tier: T0}
  recent_errors: {tier: T0}
  run_timeline: {tier: T0}
  event_bus_status: {tier: T0}
  dead_letters: {tier: T0}
  doctor_report: {tier: T0}

  # ---------------------------------------------------------------- terminal / structured-output tools
  submit_plan: {tier: T0, agents: [foreman]}
  submit_verdict: {tier: T0, agents: [judge]}
  submit_brief: {tier: T0}
  submit_diagnosis: {tier: T1, agents: [sentinel]}   # K4: appends a diagnosis note to an incident
  submit_report: {tier: T1, agents: [finance, ceo]}   # J3: stored, immutable report snapshot

  # ---------------------------------------------------------------- store
  create_product: {tier: T1, agents: [store_ops]}
  add_license_keys: {tier: T1, agents: [store_ops, supply]}
  activate_product: {tier: T1, agents: [store_ops]}
  deliver_order: {tier: T1, agents: [store_ops]}
  update_price:
    tier: T2
    agents: [store_ops, finance]
    price_change_pct_max: 20
    reason: "Price changes above 20% affect margin and customer trust."
  refund_order:
    tier: T2
    agents: [support, finance]
    limits: {amount_eur: 50}
    reason: "Refunds above €50 need a human."

  # ---------------------------------------------------------------- communication
  send_email:
    tier: T2
    agents: [support, store_ops, marketing]
    recipient_must_be_counterparty: true
    reason: "Emails to anyone other than the customer of the current case could leak customer data."
  reply_email:
    tier: T1
    agents: [support]           # the tool itself refuses messages that aren't from the current customer
  send_newsletter:
    tier: T3
    agents: [marketing]
    reason: "Bulk email to customers is public-facing and has GDPR implications."
  publish_social_post:
    tier: T3
    agents: [marketing]
    reason: "Public content under the brand."

  # ---------------------------------------------------------------- marketing
  create_campaign: {tier: T1, agents: [marketing]}
  pause_campaign: {tier: T1, agents: [marketing, finance, ceo]}
  launch_campaign:
    tier: T2
    agents: [marketing]
    limits: {budget_eur: 150}
    monthly_budget_setting: marketing_budget_month_eur
    reason: "Ad spend above €150 per campaign or beyond the monthly marketing budget."

  # ---------------------------------------------------------------- finance & supply
  record_expense:
    tier: T2
    agents: [finance]
    limits: {amount_eur: 200}
  register_vendor:
    tier: T2
    agents: [supply, foreman]
    limits: {monthly_cost_eur: 50}
    monthly_budget_setting: vendor_budget_month_eur
    reason: "New recurring vendor cost."

  # ---------------------------------------------------------------- executive
  set_okr: {tier: T1, agents: [ceo]}
  record_decision: {tier: T1, agents: [ceo]}
  request_provisioning:
    tier: T3
    agents: [ceo]
    reason: "Creating accounts, accepting terms, and adding payment methods happen only by a human."
  request_account_need: {tier: T1}   # E4: any agent may say it needs an account; the CEO decides, a human provisions

  # ---------------------------------------------------------------- memory
  remember: {tier: T1}
  propose_lesson: {tier: T1}

  # ---------------------------------------------------------------- self-tooling
  propose_tool: {tier: T1, agents: [foreman, researcher]}
  sandbox_tool: {tier: T1, agents: [foreman]}
  approve_tool:
    tier: T3
    agents: [foreman]
    reason: "Promotes a new MCP server or skill to production."
  grant_tool:
    tier: T3
    agents: [foreman]
    reason: "Changes which agent can use which capability."

  # ---------------------------------------------------------------- never by an agent
  delete_customer_data: {tier: T4}
  change_policy: {tier: T4}
