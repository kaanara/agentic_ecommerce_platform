# Dashboard theme (light and dark follow the viewer's system setting). No custom CSS anywhere: only this file.
# No web font on purpose: the dashboard runs on a Pi that may be offline, and nothing should call out to Google.

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f5fbf"
font = "sans-serif"
baseRadius = "0.6rem"
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#1b2430"
borderColor = "#d9dee7"
greenColor = "#1a7f37"
orangeColor = "#b45309"
redColor = "#c62828"
blueColor = "#1f5fbf"

[theme.light.sidebar]
backgroundColor = "#f3f5f9"
secondaryBackgroundColor = "#e6eaf1"

[theme.dark]
base = "dark"
primaryColor = "#6aa8ff"
backgroundColor = "#0f141b"
secondaryBackgroundColor = "#18202b"
textColor = "#e6ebf2"
borderColor = "#2a3442"
greenColor = "#3fb97a"
orangeColor = "#f0a04b"
redColor = "#f26d6d"
blueColor = "#6aa8ff"
blueBackgroundColor = "#16263d"
greenBackgroundColor = "#14301f"
orangeBackgroundColor = "#3a2a14"
redBackgroundColor = "#3b1b1b"
yellowBackgroundColor = "#363014"
chartCategoricalColors = ["#5b9cf0", "#f0845a", "#3cc496", "#f2b830", "#ee95b8", "#35a835", "#8b7ee0", "#f06c6b"]

[theme.dark.sidebar]
backgroundColor = "#131a23"
secondaryBackgroundColor = "#1d2733"
